name: Android (AutoTasker)

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:

permissions:
  contents: write

env:
  # Tag fixe : l'URL de téléchargement ne change jamais d'une version à l'autre.
  RELEASE_TAG: autotasker-latest

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: android
        env:
          # Le numéro de run garantit un versionCode croissant : Android accepte
          # l'installation par-dessus la version précédente sans désinstaller.
          AUTOTASKER_VERSION_CODE: ${{ github.run_number }}
          AUTOTASKER_VERSION_NAME: 1.${{ github.run_number }}
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/autotasker.apk"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: autotasker-apk
          path: autotasker.apk
          if-no-files-found: error

      - name: Publish to the fixed-tag release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # La release est recréée à chaque fois pour que le tag suive le dernier commit,
          # tout en gardant une URL de téléchargement identique.
          gh release delete "$RELEASE_TAG" --cleanup-tag --yes || true
          URL="https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/autotasker.apk"
          {
            printf 'Build automatique du commit `%s` (version 1.%s).\n\n' "${GITHUB_SHA:0:7}" "${{ github.run_number }}"
            printf '**Téléchargement direct :** %s\n\n' "$URL"
            printf "Cette URL ne change jamais. L'APK est signé avec une clé stable : il s'installe par-dessus la version précédente sans désinstallation.\n"
          } > notes.md
          gh release create "$RELEASE_TAG" autotasker.apk \
            --title "AutoTasker — dernière version" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --notes-file notes.md

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          echo "### APK prêt" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/autotasker.apk" >> "$GITHUB_STEP_SUMMARY"
